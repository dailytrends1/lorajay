<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise Exclusiva em Vídeo</title>
    <style>
        /* Reset & Strict Single-Screen Mobile Layout */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden; /* Prevents page scrolling */
            background-color: #0f172a;
            color: #f8fafc;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            height: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 6px 0;
        }

        /* Urgency Banner */
        .banner {
            background-color: #ef4444;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 5px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: pulse 2s infinite;
            width: 100%;
        }

        /* Headline */
        h1 {
            font-size: 14px;
            line-height: 1.2;
            font-weight: 800;
            color: #ffffff;
            margin: 4px 0;
        }

        h1 span {
            color: #38bdf8;
        }

        /* Adjusted Video Player to Fit 1 Screen */
        .video-wrapper {
            position: relative;
            width: 100%;
            flex-grow: 1; /* Takes up remaining height dynamically */
            max-height: 60vh; 
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            background: #000;
            border: 1px solid #334155;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Custom Play Button Overlay */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .play-button {
            width: 54px;
            height: 54px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
            margin-bottom: 8px;
        }

        .play-button::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-top: 9px solid transparent;
            border-bottom: 9px solid transparent;
            border-left: 15px solid #ffffff;
            margin-left: 3px;
        }

        .play-text {
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Call-To-Action Button */
        .btn-cta {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 6px;
        }

        .btn-cta:active {
            transform: scale(0.98);
        }

        /* Subtext */
        .subtext {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.85; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Urgency Banner (Translated to Portuguese) -->
        <div class="banner">
            ⚠️ Acesso Limitado: Registo A Fechar Brevemente
        </div>

        <!-- Headline (Translated) -->
        <h1>Veja O Vídeo Abaixo <span>Para Resgatar O Acesso</span></h1>

        <!-- Video Container -->
        <div class="video-wrapper" onclick="playVideoWithSound()">
            
            <!-- Play Overlay (Translated) -->
            <div class="play-overlay" id="overlay">
                <div class="play-button"></div>
                <div class="play-text">🔊 Toque Para Ouvir Com Som</div>
            </div>

            <!-- Video Tag -->
            <video id="myVideo" controls playsinline loop>
                <source src="video_2026-10-18_10-34-44.mp4" type="video/mp4">
                O seu navegador não suporta a reprodução deste vídeo.
            </video>

        </div>

        <!-- CTA Button (Translated & Linked) -->
        <a href="https://ldl1.com/link?z=11892232&var={SOURCE_ID}&ymid={CLICK_ID}" class="btn-cta">
            👉 Continuar Para O Portal Agora
        </a>

        <!-- Subtext (Translated) -->
        <p class="subtext">🔒 Portal de Verificação Seguro</p>

    </div>

    <script>
        function playVideoWithSound() {
            var video = document.getElementById("myVideo");
            var overlay = document.getElementById("overlay");

            video.muted = false;
            video.play();
            overlay.style.display = "none";
        }
    </script>

</body>
</html>
