<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Video Breakdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
            text-align: center;
        }

        /* Urgency Banner */
        .banner {
            background-color: #ef4444;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            animation: pulse 2s infinite;
        }

        /* Headline */
        h1 {
            font-size: 18px;
            line-height: 1.3;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
        }

        h1 span {
            color: #38bdf8;
        }

        /* Portrait (9:16) Vertical Video Container */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 177.78%; /* 9:16 Vertical Portrait Ratio */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            background: #000;
            margin-bottom: 16px;
            border: 1px solid #334155;
            cursor: pointer;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Play Button Overlay */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .play-button {
            width: 70px;
            height: 70px;
            background: #22c55e;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
            margin-bottom: 12px;
        }

        .play-button::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #ffffff;
            margin-left: 4px;
        }

        .play-text {
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Call-To-Action Button */
        .btn-cta {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s;
        }

        .btn-cta:active {
            transform: scale(0.98);
        }

        .subtext {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.85; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Urgency Banner -->
        <div class="banner">
            ⚠️ Limited Access: Registration Window Closing Soon
        </div>

        <!-- Main Headline -->
        <h1>Watch The Full Breakdown Video Below <span>To Claim Access</span></h1>

        <!-- Portrait (9:16) Video Container -->
        <div class="video-wrapper" onclick="playVideoWithSound()">
            
            <!-- Custom Play Button Overlay -->
            <div class="play-overlay" id="overlay">
                <div class="play-button"></div>
                <div class="play-text">🔊 Tap To Watch With Sound</div>
            </div>

            <!-- Video Player (No autoplay, Unmuted) -->
            <video id="myVideo" controls playsinline loop>
                <source src="video_2026-10-18_10-34-44.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

        </div>

        <!-- Offer Button (Zeydoo Link) -->
        <a href="YOUR_ZEYDOO_OFFER_LINK_HERE" class="btn-cta">
            👉 Continue To Portal Now
        </a>

        <!-- Trust Subtext -->
        <p class="subtext">🔒 Safe & Secure Verification Portal</p>

    </div>

    <!-- JavaScript to Trigger Audio Playback on User Tap -->
    <script>
        function playVideoWithSound() {
            var video = document.getElementById("myVideo");
            var overlay = document.getElementById("overlay");

            // Unmute & Play Video
            video.muted = false;
            video.play();

            // Hide the Overlay once video starts
            overlay.style.display = "none";
        }
    </script>

</body>
</html>
