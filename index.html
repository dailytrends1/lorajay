<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exclusive Video Breakdown</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px; /* Optimized Mobile Container */
            margin: 0 auto;
            text-align: center;
        }

        /* Urgency Banner */
        .banner {
            background-color: #ef4444;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            padding: 8px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            animation: pulse 2s infinite;
        }

        /* Headline */
        h1 {
            font-size: 18px;
            line-height: 1.3;
            font-weight: 800;
            margin-bottom: 12px;
            color: #ffffff;
        }

        h1 span {
            color: #38bdf8;
        }

        /* Portrait (9:16) Vertical Video Container */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 177.78%; /* 9:16 Vertical Portrait Aspect Ratio */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            background: #000;
            margin-bottom: 16px;
            border: 1px solid #334155;
        }

        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures vertical video fills entire frame */
        }

        /* Call-To-Action Button */
        .btn-cta {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.2s;
        }

        .btn-cta:active {
            transform: scale(0.98);
        }

        /* Subtext / Trust Badges */
        .subtext {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
        }

        /* Pulse Animation for Urgency Banner */
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.85; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Urgency Banner -->
        <div class="banner">
            ⚠️ Limited Access: Registration Window Closing Soon
        </div>

        <!-- Main Headline -->
        <h1>Watch The Full Breakdown Video Below <span>To Claim Access</span></h1>

        <!-- Portrait (9:16) Video Player -->
        <div class="video-wrapper">
            <!-- Replace 'your-banned-video.mp4' with the actual link/path to your vertical video -->
            <video controls autoplay muted playsinline loop>
                <source src="video_2026-10-18_10-34-44.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>

        <!-- The Offer Button (Zeydoo Link) -->
        <!-- Replace 'YOUR_ZEYDOO_OFFER_LINK_HERE' with your actual affiliate link -->
        <a href="YOUR_ZEYDOO_OFFER_LINK_HERE" class="btn-cta">
            👉 Continue To Portal Now
        </a>

        <!-- Trust Subtext -->
        <p class="subtext">🔒 Safe & Secure Verification Portal</p>

    </div>

</body>
</html>
